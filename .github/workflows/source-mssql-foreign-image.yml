name: source-mssql foreign-table image

on:
  push:
    branches: [fix/mssql-foreign-table]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: airbyte-integrations/connectors/source-mssql/foreign-image
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/source-mssql:5.0.1-fa1
